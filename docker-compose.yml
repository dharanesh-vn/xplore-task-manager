services:

  mongodb:
    image: mongo:7

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - mongodb

  frontend:
    build: ./frontend

    ports:
      - "3001:80"

    depends_on:
      - backend

volumes:
  mongo-data:
